<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1600, initial-scale=1" />
<title>Komari Commander Preview</title>
<style>
  @font-face {
    font-family: 'SF';
    src: url('file:///System/Library/Fonts/SFNS.ttf');
  }
  @font-face {
    font-family: 'SFMono';
    src: url('file:///System/Library/Fonts/SFNSMono.ttf');
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1600px;
    height: 900px;
    overflow: hidden;
    font-family: SF, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e8fbff;
    background:
      radial-gradient(circle at 78% 34%, rgba(15, 216, 232, 0.22), transparent 34%),
      radial-gradient(circle at 18% 20%, rgba(126, 86, 255, 0.20), transparent 32%),
      linear-gradient(135deg, #02070c 0%, #07121a 48%, #0d1118 100%);
  }
  .stage {
    position: relative;
    width: 1600px;
    height: 900px;
    padding: 108px 92px;
    isolation: isolate;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(77, 219, 231, 0.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77, 219, 231, 0.075) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: linear-gradient(90deg, rgba(0,0,0,.8), rgba(0,0,0,.25) 55%, rgba(0,0,0,.7));
    opacity: .7;
    z-index: -3;
  }
  .scanline {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 5px);
    mix-blend-mode: overlay;
    opacity: .28;
    z-index: 5;
    pointer-events: none;
  }
  .orbit {
    position: absolute;
    left: -110px;
    bottom: 100px;
    width: 850px;
    height: 290px;
    border: 2px solid rgba(74, 230, 222, .24);
    border-color: transparent transparent rgba(74,230,222,.24) transparent;
    border-radius: 50%;
    transform: rotate(-7deg);
    z-index: -2;
  }
  .brand {
    position: relative;
    z-index: 3;
    width: 560px;
    padding-top: 52px;
  }
  .eyebrow {
    font: 700 18px/1 SFMono, monospace;
    letter-spacing: .28em;
    color: #56f1eb;
    text-transform: uppercase;
    text-shadow: 0 0 18px rgba(38, 232, 238, .55);
  }
  h1 {
    margin: 28px 0 0;
    font-size: 104px;
    line-height: .9;
    letter-spacing: -0.065em;
    font-weight: 860;
    color: #f3feff;
    text-shadow: 0 0 42px rgba(67, 231, 240, .18);
  }
  h1 span {
    display: block;
    color: #40e0e7;
    letter-spacing: -0.055em;
  }
  .underline {
    width: 96px;
    height: 5px;
    margin: 32px 0 24px;
    border-radius: 999px;
    background: linear-gradient(90deg, #22d3ee, #a970ff);
    box-shadow: 0 0 24px rgba(34, 211, 238, .5);
  }
  .tagline {
    width: 520px;
    margin: 0;
    color: rgba(226, 246, 250, .78);
    font-size: 32px;
    line-height: 1.25;
    letter-spacing: -0.03em;
  }
  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    width: 540px;
    margin-top: 42px;
  }
  .pill {
    padding: 12px 19px;
    border: 1px solid rgba(84, 229, 238, .33);
    border-radius: 999px;
    background: rgba(5, 19, 30, .72);
    color: rgba(237, 253, 255, .92);
    font-weight: 720;
    font-size: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 0 22px rgba(61, 222, 234, .08);
    backdrop-filter: blur(14px);
  }
  .meta {
    position: absolute;
    left: 94px;
    bottom: 80px;
    display: flex;
    gap: 16px;
    align-items: center;
    font: 700 18px/1 SFMono, monospace;
    color: rgba(211, 244, 247, .74);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #29f3e7; box-shadow: 0 0 18px #29f3e7; }
  .showcase {
    position: absolute;
    right: 54px;
    top: 74px;
    width: 930px;
    height: 760px;
    perspective: 1400px;
    z-index: 2;
  }
  .card {
    position: absolute;
    overflow: hidden;
    border-radius: 28px;
    border: 1px solid rgba(111, 236, 244, .38);
    background: rgba(9, 20, 30, .7);
    box-shadow:
      0 38px 90px rgba(0, 0, 0, .48),
      0 0 0 1px rgba(255,255,255,.05) inset,
      0 0 58px rgba(34, 211, 238, .18);
  }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .main-card {
    width: 858px;
    height: 480px;
    right: 0;
    top: 142px;
    transform: rotateY(-12deg) rotateX(5deg) rotateZ(-1deg);
  }
  .main-card img { object-position: 50% 50%; }
  .light-card {
    width: 560px;
    height: 315px;
    right: 22px;
    top: 0;
    border-color: rgba(229, 255, 255, .75);
    box-shadow: 0 34px 72px rgba(111, 236, 244, .20), 0 0 0 1px rgba(15, 55, 64, .06) inset;
    transform: rotateY(-18deg) rotateX(8deg) rotateZ(5deg);
    opacity: .96;
  }
  .clean-card {
    width: 460px;
    height: 258px;
    left: 14px;
    bottom: 34px;
    border-color: rgba(255, 255, 255, .72);
    box-shadow: 0 28px 70px rgba(3, 13, 22, .55);
    transform: rotateY(18deg) rotateX(4deg) rotateZ(-5deg);
    opacity: .92;
  }
  .badge {
    position: absolute;
    right: 106px;
    top: 82px;
    z-index: 4;
    padding: 13px 18px;
    border-radius: 18px;
    background: rgba(234, 255, 252, .94);
    color: #05363a;
    font: 850 22px/1 SFMono, monospace;
    box-shadow: 0 18px 46px rgba(10, 243, 226, .26);
  }
  .badge::before {
    content: '';
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 8px;
    border-radius: 50%;
    background: #1fdb9f;
  }
  .glow {
    position: absolute;
    right: 160px;
    top: 95px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34, 211, 238, .22), transparent 68%);
    filter: blur(8px);
    z-index: -1;
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="grid"></div>
    <div class="orbit"></div>
    <section class="brand">
      <div class="eyebrow">Komari theme</div>
      <h1>Commander<span>Monitor</span></h1>
      <div class="underline"></div>
      <p class="tagline">Mission-control monitoring for global nodes, realtime charts, and privacy-safe public dashboards.</p>
      <div class="pills">
        <div class="pill">3 visual themes</div>
        <div class="pill">3D globe</div>
        <div class="pill">Privacy mode</div>
        <div class="pill">Live telemetry</div>
      </div>
    </section>
    <div class="meta"><span class="dot"></span><span>GLOBE</span><span>GRID</span><span>TABLE</span><span>UPTIME</span></div>
    <section class="showcase" aria-label="Commander theme screenshots">
      <div class="glow"></div>
      <div class="card light-card"><img src="./screenshot/lumina-grid.webp" alt="Lumina grid" /></div>
      <div class="card clean-card"><img src="./screenshot/clean-grid.webp" alt="Clean grid" /></div>
      <div class="card main-card"><img src="./screenshot/deepspace-globe.webp" alt="DeepSpace globe" /></div>
      <div class="badge">14 ON</div>
    </section>
    <div class="scanline"></div>
  </main>
</body>
</html>
