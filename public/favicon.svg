<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Komari Commander">
  <defs>
    <radialGradient id="plate" cx="48%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#17314a"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="sweep" x1="256" y1="256" x2="460" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#plate)"/>

  <g transform="translate(256 256)" filter="url(#soft-glow)">
    <circle r="216" fill="#081522" stroke="#22d3ee" stroke-width="20"/>
    <path d="M0 0 L180 -112 A216 216 0 0 1 188 80 Z" fill="url(#sweep)"/>
    <path d="M-172 -28 C-76 12 64 16 176 -48" stroke="#7cf4ff" stroke-width="22" stroke-linecap="round"/>
    <path d="M-84 -184 C-128 -80 -124 80 -64 184" stroke="#7cf4ff" stroke-width="22" stroke-linecap="round"/>
    <circle r="34" fill="#eaffff"/>
    <circle cx="108" cy="56" r="18" fill="#22c55e"/>
  </g>
</svg>
